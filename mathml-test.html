<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathML Test</title>
</head>
<body>
    <math xmlns="http://www.w3.org/1998/Math/MathML"> 
      <mrow> 
        <msqrt> 
          <mi>x</mi> 
          <mo>-</mo> 
          <mn>3</mn> 
        </msqrt> 
        <mo>+</mo> 
        <msqrt> 
          <mn>3</mn> 
          <mi>x</mi> 
        </msqrt> 
        <mo>+</mo> 
        <msqrt> 
          <mfrac> 
            <msqrt> 
              <mn>3</mn> 
              <mi>x</mi> 
            </msqrt> 
            <mrow> 
              <mi>x</mi> 
              <mo>-</mo> 
              <mn>3</mn> 
            </mrow> 
          </mfrac> 
        </msqrt> 
      </mrow> 
    </math>
</body>
</html>
